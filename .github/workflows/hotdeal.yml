name: hotdeal
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정으로 몇 분 밀릴 수 있음)
  workflow_dispatch:
permissions:
  contents: write
concurrency: hotdeal
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node pipeline.mjs
        env:
          CP_ACCESS_KEY: ${{ secrets.CP_ACCESS_KEY }}
          CP_SECRET_KEY: ${{ secrets.CP_SECRET_KEY }}
          CP_SUB_ID: ${{ vars.CP_SUB_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: commit data + site
        run: |
          git config user.name "hotdeal-bot"
          git config user.email "hotdeal-bot@users.noreply.github.com"
          git add data docs
          git commit -m "update deals $(date -u +%FT%TZ)" || echo "no changes"
          git push
